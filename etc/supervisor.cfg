# Supervisor Settings
# ===================
#
# Tells the Supervisor daemon how it can be accessed and what processes it
# must start & monitor.

[supervisor]
recipe      = collective.recipe.supervisor
user        = ${supervisor:username}
password    = ${supervisor:password}
http-socket = unix
file        = ${buildout:directory}/var/supervisor.socket
programs    =
    10 zeo ${buildout:bin-directory}/zeo [fg] true
    20 zope ${buildout:bin-directory}/zope [console] true
# Fields above are: priority, name, (options, none used), path-to-exec, arguments [in brackets], true=redirect stderr
